# How the app looks. Streamlit reads this file on its own when you run app.py.
# "Earthy and serene": warm sand surfaces, near-black soil text, and the olive green
# of the reference photo as the one accent. Change a colour here, not in app.py.
[theme]
base = "light"
primaryColor = "#4A5D3A"            # olive green: buttons, links, the selected thing, Stage 2
backgroundColor = "#C8B49A"         # lifted sand: the page
secondaryBackgroundColor = "#AC8968" # warm sand: cards, sidebar, inputs
textColor = "#3E362E"               # soil: all text
font = "sans serif"

[server]
headless = true
